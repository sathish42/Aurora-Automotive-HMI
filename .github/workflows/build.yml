name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64 and Qt
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-shadertools

      - name: Configure
        run: |
          cmake --preset msys2-ucrt64 \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$MSYSTEM_PREFIX")"

      - name: Build
        run: cmake --build build/mingw-ucrt64 --parallel 4

      - name: Run service and QML tests
        run: ctest --test-dir build/mingw-ucrt64 --output-on-failure
