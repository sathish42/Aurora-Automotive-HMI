name: Android package

on:
  workflow_dispatch:
  push:
    paths:
      - "CMakeLists.txt"
      - "qml/**"
      - "src/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "qml/**"
      - "src/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Configure Android build
        run: |
          cmake -S . -B build/android -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF

      - name: Build debug APK
        run: cmake --build build/android --target auto-hmi_make_apk --parallel 4

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-hmi-android-arm64
          path: build/android/android-build/build/outputs/apk/debug/*.apk
          if-no-files-found: error
